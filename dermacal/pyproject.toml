[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="dermacal"
version="0.1.0"
description="Image degradation reliability and quality-aware calibration toolkit"
readme="README.md"
license={text="MIT"}
requires-python=">=3.10"
dependencies=["numpy>=1.24", "pillow>=10"]
[project.optional-dependencies]
dev=["pytest>=8","ruff>=0.8"]
[tool.hatch.build.targets.wheel]
packages=["src/dermacal"]
