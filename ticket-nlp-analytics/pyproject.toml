[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="ticket-nlp-analytics"
version="0.1.0"
description="Hierarchical ticket classification and operational analytics reference"
readme="README.md"
license={text="MIT"}
requires-python=">=3.10"
dependencies=["scikit-learn>=1.3"]
[project.optional-dependencies]
dev=["pytest>=8","ruff>=0.8"]
[tool.hatch.build.targets.wheel]
packages=["src/ticket_nlp"]
