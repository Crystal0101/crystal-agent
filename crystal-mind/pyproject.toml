[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crystal-mind"
version = "0.2.0"
description = "Your personal AI chief of staff — scan your data, understand your context, execute your goals"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "agent", "personal-planning", "data-management", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.25.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
security = ["crystal-shield>=0.1.0"]

[project.scripts]
crystal-mind = "crystal_mind.cli:main"

[project.urls]
Homepage = "https://github.com/Crystal0101/crystal-agent"
Repository = "https://github.com/Crystal0101/crystal-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/crystal_mind"]

[tool.pytest.ini_options]
markers = [
    "offline: tests that run without network or API keys",
    "online: tests that require ANTHROPIC_API_KEY and network",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

# Third-party packages without type stubs / py.typed markers.
[[tool.mypy.overrides]]
module = ["fitz", "crystal_shield", "crystal_shield.*"]
ignore_missing_imports = true
