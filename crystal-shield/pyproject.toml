[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crystal-shield"
version = "0.1.0"
description = "Model-independent prompt injection detection and policy enforcement for LLM agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["llm", "agent", "security", "prompt-injection", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/Crystal0101/crystal-agent"
Repository = "https://github.com/Crystal0101/crystal-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/crystal_shield"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
