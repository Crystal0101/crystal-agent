name: crystal-mind CI

on:
  push:
    paths:
      - "crystal-mind/**"
      - ".github/workflows/crystal-mind-ci.yml"
  pull_request:
    paths:
      - "crystal-mind/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: crystal-mind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev deps)
        run: pip install -e "../crystal-shield" -e ".[dev]" build

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy src

      - name: Offline tests + coverage
        run: pytest -m offline --cov=crystal_mind --cov-report=term-missing

      - name: Build wheel and source distribution
        run: python -m build
